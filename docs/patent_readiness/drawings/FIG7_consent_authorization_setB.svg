<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <style>
    .box { fill: #ffffff; stroke: #000000; stroke-width: 2; }
    .title { font-family: sans-serif; font-size: 13px; font-weight: bold; text-anchor: middle; }
    .label { font-family: sans-serif; font-size: 11px; text-anchor: middle; }
    .arrow { stroke: #000000; stroke-width: 1.5; marker-end: url(#arrow); fill: none; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000" />
    </marker>
  </defs>
  <text x="400" y="30" class="title">FIG. 7: PATIENT CONSENT &amp; DOCTOR AUTHORIZATION ARCHITECTURE</text>

  <rect x="50" y="80" width="180" height="80" class="box" />
  <text x="140" y="105" class="title">Doctor Access Request</text>
  <text x="140" y="125" class="label">Verified Doctor</text>
  <text x="140" y="140" class="label">POST /consent/request</text>

  <rect x="310" y="80" width="180" height="80" class="box" />
  <text x="400" y="105" class="title">Patient Consent Review</text>
  <text x="400" y="125" class="label">Approve / Reject Action</text>
  <text x="400" y="140" class="label">POST /consent/grant/{id}</text>

  <rect x="570" y="80" width="180" height="80" class="box" />
  <text x="660" y="105" class="title">Backend Access Barrier</text>
  <text x="660" y="125" class="label">DB Consent status == active</text>
  <text x="660" y="140" class="label">Immediate cache invalidation</text>

  <rect x="310" y="230" width="240" height="80" class="box" />
  <text x="430" y="255" class="title">Smart Contract Audit Log</text>
  <text x="430" y="275" class="label">Emits ConsentGranted(patient, doctor)</text>
  <text x="430" y="290" class="label">Emits ConsentRevoked(patient, doctor)</text>

  <path d="M 230 120 L 310 120" class="arrow" />
  <path d="M 490 120 L 570 120" class="arrow" />
  <path d="M 400 160 L 400 230" class="arrow" />
</svg>