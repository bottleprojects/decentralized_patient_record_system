<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <style>
    .box { fill: #ffffff; stroke: #000000; stroke-width: 2; }
    .title { font-family: sans-serif; font-size: 13px; font-weight: bold; text-anchor: middle; }
    .label { font-family: sans-serif; font-size: 11px; text-anchor: middle; }
    .arrow { stroke: #000000; stroke-width: 1.5; marker-end: url(#arrow); fill: none; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000" />
    </marker>
  </defs>
  <text x="400" y="30" class="title">FIG. 5: CRYPTOGRAPHIC PROCESSING, IPFS &amp; BLOCKCHAIN ANCHORING</text>

  <rect x="50" y="80" width="180" height="80" class="box" />
  <text x="140" y="105" class="title">Clinical Report PDF (502)</text>
  <text x="140" y="125" class="label">Bound Acquisition Manifest</text>
  <text x="140" y="140" class="label">SHA-256 = original_hash</text>

  <rect x="310" y="80" width="180" height="80" class="box" />
  <text x="400" y="105" class="title">AES-256-GCM (504)</text>
  <text x="400" y="125" class="label">12-byte Unique Nonce</text>
  <text x="400" y="140" class="label">16-byte Auth Tag</text>

  <rect x="570" y="80" width="180" height="80" class="box" />
  <text x="660" y="105" class="title">IPFS Cluster (506)</text>
  <text x="660" y="125" class="label">Non-identifying name: enc_UUID.bin</text>
  <text x="660" y="140" class="label">Returns Content ID: CID</text>

  <rect x="310" y="240" width="240" height="100" class="box" />
  <text x="430" y="265" class="title">Sepolia Smart Contract (508)</text>
  <text x="430" y="285" class="label">storeIPFSRecordWithProvenance</text>
  <text x="430" y="305" class="label">Tuple: (CID, original_hash, H_acq)</text>
  <text x="430" y="325" class="label">Emits IPFSRecordWithProvenanceStored</text>

  <path d="M 230 120 L 310 120" class="arrow" />
  <path d="M 490 120 L 570 120" class="arrow" />
  <path d="M 660 160 L 660 290 L 550 290" class="arrow" />
</svg>