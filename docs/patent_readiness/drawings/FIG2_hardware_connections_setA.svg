<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <style>
    .box { fill: #ffffff; stroke: #000000; stroke-width: 2; }
    .wire { stroke: #000000; stroke-width: 1.5; fill: none; }
    .title { font-family: sans-serif; font-size: 14px; font-weight: bold; text-anchor: middle; }
    .label { font-family: sans-serif; font-size: 11px; }
  </style>
  <text x="400" y="30" class="title">FIG. 2: SENSOR HARDWARE INTERFACES &amp; PIN CONNECTIONS</text>

  <!-- ESP32 SoC -->
  <rect x="300" y="100" width="200" height="380" class="box" />
  <text x="400" y="130" class="title">ESP32-WROOM-32 (200)</text>
  <text x="400" y="150" style="font-size:10px;text-anchor:middle;">Xtensa Dual-Core 240MHz</text>

  <!-- Pins Left Side -->
  <text x="310" y="200" class="label">GPIO 21 (SDA) [202]</text>
  <text x="310" y="230" class="label">GPIO 22 (SCL) [204]</text>
  <text x="310" y="260" class="label">3V3 Power [206]</text>
  <text x="310" y="290" class="label">GND [208]</text>

  <!-- Pins Right Side -->
  <text x="410" y="350" class="label">[210] GPIO 36 (ADC1_0)</text>
  <text x="410" y="380" class="label">[212] GPIO 34 (LO+)</text>
  <text x="410" y="410" class="label">[214] GPIO 35 (LO-)</text>
  <text x="410" y="440" class="label">[216] GPIO 32 (SDN)</text>

  <!-- MAX30102 Module -->
  <rect x="50" y="170" width="160" height="150" class="box" />
  <text x="130" y="195" class="title">MAX30102 (220)</text>
  <text x="60" y="225" class="label">SDA [222]</text>
  <text x="60" y="255" class="label">SCL [224]</text>
  <text x="60" y="285" class="label">VIN (3.3V) [226]</text>
  <text x="60" y="310" class="label">GND [228]</text>

  <!-- AD8232 Module -->
  <rect x="590" y="320" width="160" height="160" class="box" />
  <text x="670" y="345" class="title">AD8232 ECG (230)</text>
  <text x="600" y="375" class="label">OUTPUT [232]</text>
  <text x="600" y="405" class="label">LO+ [234]</text>
  <text x="600" y="435" class="label">LO- [236]</text>
  <text x="600" y="465" class="label">SDN [238]</text>

  <!-- Wires -->
  <path d="M 210 220 L 300 195" class="wire" />
  <path d="M 210 250 L 300 225" class="wire" />
  <path d="M 210 280 L 300 255" class="wire" />
  <path d="M 210 305 L 300 285" class="wire" />

  <path d="M 500 345 L 590 370" class="wire" />
  <path d="M 500 375 L 590 400" class="wire" />
  <path d="M 500 405 L 590 430" class="wire" />
  <path d="M 500 435 L 590 460" class="wire" />
</svg>