<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <style>
    .box { fill: #ffffff; stroke: #000000; stroke-width: 2; }
    .title { font-family: sans-serif; font-size: 14px; font-weight: bold; text-anchor: middle; }
    .label { font-family: sans-serif; font-size: 11px; text-anchor: middle; }
    .num { font-family: sans-serif; font-size: 12px; font-weight: bold; fill: #000000; }
    .arrow { stroke: #000000; stroke-width: 1.5; marker-end: url(#arrow); fill: none; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="30" class="title">FIG. 1: OVERALL SYSTEM ARCHITECTURE</text>

  <!-- Physical Sensors Layer -->
  <rect x="50" y="80" width="160" height="80" class="box" />
  <text x="130" y="110" class="title">Sensors (102)</text>
  <text x="130" y="130" class="label">MAX30102 PPG (104)</text>
  <text x="130" y="145" class="label">AD8232 ECG (106)</text>
  <text x="40" y="85" class="num">100</text>

  <!-- Edge Authenticator -->
  <rect x="50" y="220" width="160" height="90" class="box" />
  <text x="130" y="245" class="title">ESP32 Gateway (110)</text>
  <text x="130" y="265" class="label">Hardware Timer (112)</text>
  <text x="130" y="280" class="label">HMAC Signer (114)</text>
  <text x="130" y="295" class="label">Pre-shared Secret (116)</text>

  <!-- Backend Gateway -->
  <rect x="310" y="150" width="180" height="160" class="box" />
  <text x="400" y="175" class="title">Backend Ingestion (120)</text>
  <text x="400" y="200" class="label">Sliding Window Freshness (122)</text>
  <text x="400" y="220" class="label">Monotonic Anti-Replay (124)</text>
  <text x="400" y="240" class="label">Device-Patient Map (126)</text>
  <text x="400" y="260" class="label">Capture Session Engine (128)</text>
  <text x="400" y="280" class="label">Merkle Digest Generator (130)</text>

  <!-- IPFS Storage Cluster -->
  <rect x="570" y="80" width="180" height="80" class="box" />
  <text x="660" y="110" class="title">IPFS Cluster (140)</text>
  <text x="660" y="130" class="label">AES-256-GCM Ciphertext (142)</text>
  <text x="660" y="145" class="label">Content ID: CID (144)</text>

  <!-- Blockchain Layer -->
  <rect x="570" y="220" width="180" height="90" class="box" />
  <text x="660" y="245" class="title">EVM Smart Contract (150)</text>
  <text x="660" y="265" class="label">PatientRecord.sol (152)</text>
  <text x="660" y="280" class="label">Record Tuple &amp; H_acq (154)</text>
  <text x="660" y="295" class="label">Writer Role Protection (156)</text>

  <!-- Clinical Dashboard -->
  <rect x="310" y="410" width="180" height="100" class="box" />
  <text x="400" y="435" class="title">Clinical Dashboard (160)</text>
  <text x="400" y="455" class="label">Dual-Verification Engine (162)</text>
  <text x="400" y="475" class="label">Tier 1 Content Check (164)</text>
  <text x="400" y="495" class="label">Tier 2 Origin Provenance (166)</text>

  <!-- Arrows -->
  <path d="M 130 160 L 130 220" class="arrow" />
  <path d="M 210 265 L 310 265" class="arrow" />
  <path d="M 490 200 L 570 120" class="arrow" />
  <path d="M 490 265 L 570 265" class="arrow" />
  <path d="M 400 310 L 400 410" class="arrow" />
  <path d="M 660 160 L 660 220" class="arrow" />
  <path d="M 570 140 L 490 430" class="arrow" />
  <path d="M 570 285 L 490 460" class="arrow" />
</svg>