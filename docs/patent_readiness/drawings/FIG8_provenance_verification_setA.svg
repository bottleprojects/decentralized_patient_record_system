<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <style>
    .box { fill: #ffffff; stroke: #000000; stroke-width: 2; }
    .title { font-family: sans-serif; font-size: 13px; font-weight: bold; text-anchor: middle; }
    .label { font-family: sans-serif; font-size: 11px; text-anchor: middle; }
    .arrow { stroke: #000000; stroke-width: 1.5; marker-end: url(#arrow); fill: none; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000" />
    </marker>
  </defs>
  <text x="400" y="30" class="title">FIG. 8: END-TO-END MEASUREMENT PROVENANCE VERIFICATION</text>

  <rect x="50" y="80" width="160" height="80" class="box" />
  <text x="130" y="105" class="title">Hardware Sensor (802)</text>
  <text x="130" y="125" class="label">Actual biopotential / PPG</text>
  <text x="130" y="140" class="label">Signed Telemetry Packet</text>

  <rect x="270" y="80" width="180" height="80" class="box" />
  <text x="360" y="105" class="title">Session Manifest (804)</text>
  <text x="360" y="125" class="label">Canonical Manifest Object</text>
  <text x="360" y="140" class="label">H_acq = SHA256(Manifest)</text>

  <rect x="510" y="80" width="240" height="80" class="box" />
  <text x="630" y="105" class="title">Smart Contract Anchor (806)</text>
  <text x="630" y="125" class="label">PatientRecord.sol</text>
  <text x="630" y="140" class="label">Stores: (CID, file_hash, H_acq)</text>

  <rect x="270" y="220" width="240" height="80" class="box" />
  <text x="390" y="245" class="title">Dual-Verification (808)</text>
  <text x="390" y="265" class="label">Verify 1: SHA256(File) == file_hash</text>
  <text x="390" y="280" class="label">Verify 2: SHA256(Acq) == H_acq</text>

  <path d="M 210 120 L 270 120" class="arrow" />
  <path d="M 450 120 L 510 120" class="arrow" />
  <path d="M 630 160 L 630 260 L 510 260" class="arrow" />
</svg>