<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <style>
    .box { fill: #ffffff; stroke: #000000; stroke-width: 2; }
    .title { font-family: sans-serif; font-size: 14px; font-weight: bold; text-anchor: middle; }
    .label { font-family: sans-serif; font-size: 11px; text-anchor: middle; }
    .arrow { stroke: #000000; stroke-width: 1.5; marker-end: url(#arrow); fill: none; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000" />
    </marker>
  </defs>
  <text x="400" y="30" class="title">FIG. 3: AUTHENTICATED TELEMETRY &amp; ANTI-REPLAY PROTOCOL</text>

  <!-- Step 1 -->
  <rect x="50" y="70" width="200" height="80" class="box" />
  <text x="150" y="95" class="title">1. Edge Packet Format (302)</text>
  <text x="150" y="115" class="label">DeviceID | Seq | Timestamp</text>
  <text x="150" y="130" class="label">HR | SpO2 | IR | ECG Samples</text>

  <!-- Step 2 -->
  <rect x="300" y="70" width="200" height="80" class="box" />
  <text x="400" y="95" class="title">2. HMAC Signing (304)</text>
  <text x="400" y="115" class="label">K_device secret in eFuse</text>
  <text x="400" y="130" class="label">auth_tag = HMAC-SHA256(K, msg)</text>

  <!-- Step 3 -->
  <rect x="550" y="70" width="200" height="80" class="box" />
  <text x="650" y="95" class="title">3. Ingestion Route (306)</text>
  <text x="650" y="115" class="label">POST /telemetry/ingest</text>
  <text x="650" y="130" class="label">TLS-encrypted transmission</text>

  <!-- Step 4 -->
  <rect x="550" y="230" width="200" height="90" class="box" />
  <text x="650" y="255" class="title">4. Device Lookup (308)</text>
  <text x="650" y="275" class="label">Query DB Device table</text>
  <text x="650" y="290" class="label">Verify device active</text>
  <text x="650" y="305" class="label">Retrieve pre-shared secret</text>

  <!-- Step 5 -->
  <rect x="300" y="230" width="200" height="90" class="box" />
  <text x="400" y="255" class="title">5. Freshness &amp; Nonce (310)</text>
  <text x="400" y="275" class="label">|t_server - t_device| &lt;= 10s</text>
  <text x="400" y="290" class="label">seq &gt; last_seq (Anti-replay)</text>
  <text x="400" y="305" class="label">Verify HMAC signature</text>

  <!-- Step 6 -->
  <rect x="50" y="230" width="200" height="90" class="box" />
  <text x="150" y="255" class="title">6. Isolated Ingestion (312)</text>
  <text x="150" y="275" class="label">Store in _device_telemetry</text>
  <text x="150" y="290" class="label">Bind to active Patient session</text>
  <text x="150" y="305" class="label">Zero cross-patient leakage</text>

  <path d="M 250 110 L 300 110" class="arrow" />
  <path d="M 500 110 L 550 110" class="arrow" />
  <path d="M 650 150 L 650 230" class="arrow" />
  <path d="M 550 275 L 500 275" class="arrow" />
  <path d="M 300 275 L 250 275" class="arrow" />
</svg>