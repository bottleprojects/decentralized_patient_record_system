<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <style>
    .box { fill: #ffffff; stroke: #000000; stroke-width: 2; }
    .title { font-family: sans-serif; font-size: 13px; font-weight: bold; text-anchor: middle; }
    .label { font-family: sans-serif; font-size: 11px; text-anchor: middle; }
    .arrow { stroke: #000000; stroke-width: 1.5; marker-end: url(#arrow); fill: none; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000" />
    </marker>
  </defs>
  <text x="400" y="30" class="title">FIG. 4: PERSISTENT SENSOR CAPTURE WORKFLOW</text>

  <rect x="50" y="70" width="150" height="60" class="box" />
  <text x="125" y="95" class="title">IDLE</text>
  <text x="125" y="115" class="label">Modal Opened</text>

  <rect x="240" y="70" width="150" height="60" class="box" />
  <text x="315" y="95" class="title">CALIBRATING</text>
  <text x="315" y="115" class="label">Contact Verification</text>

  <rect x="430" y="70" width="150" height="60" class="box" />
  <text x="505" y="95" class="title">ACQUIRING</text>
  <text x="505" y="115" class="label">8s Continuous Sampling</text>

  <rect x="620" y="70" width="150" height="60" class="box" />
  <text x="695" y="95" class="title">VALIDATING</text>
  <text x="695" y="115" class="label">Data Quality Checks</text>

  <rect x="430" y="200" width="150" height="70" class="box" />
  <text x="505" y="225" class="title">CAPTURE COMPLETE</text>
  <text x="505" y="245" class="label">H_acq Digest Generated</text>
  <text x="505" y="260" class="label">PDF Report Rendered</text>

  <rect x="620" y="200" width="150" height="70" class="box" />
  <text x="695" y="225" class="title">FAILED</text>
  <text x="695" y="245" class="label">Signal Lost / Invalid</text>
  <text x="695" y="260" class="label">Sealing Prohibited</text>

  <path d="M 200 100 L 240 100" class="arrow" />
  <path d="M 390 100 L 430 100" class="arrow" />
  <path d="M 580 100 L 620 100" class="arrow" />
  <path d="M 695 130 L 695 200" class="arrow" />
  <path d="M 620 235 L 580 235" class="arrow" />
</svg>